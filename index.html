<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini-libreria — Settimana VII Giorno I</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

  <header class="site-header p-5 mb-4">
    <div class="header-row d-flex justify-content-between align-items-center gap-5 px-4">
      <div>
        <h1 class="fw-bold mb-3">La mia libreria</h1>
        <p class="fs-5">Cerca su Open Library, accedi al tuo profilo, salva i preferiti.</p>
      </div>
      <div id="auth-box" class="auth-box d-flex justify-content-center align-content-center gap-2 rounded p-3"></div>
    </div>
  </header>

  <main class="container">

    <section id="profilo-section" class="profilo-section card border-0 shadow-sm p-4 pb-3 mb-4" hidden>
      <h2 class="fs-4 fw-bold mb-4 mt-3">Il tuo profilo</h2>
      <div id="profilo" class="profilo d-flex justify-content-start align-items-center gap-3 mb-3"></div>
    </section>

    <section class="cerca-section card border-0 shadow-sm p-4 pb-3 mb-4">
      <h2 class="fs-4 fw-bold mb-3 mt-2">Cerca</h2>
      <div class="campo d-flex justify-content-start align-items-center gap-2">
        <label class="label-cerca" for="cerca">Titolo o Autore</label>
        <input type="search" class="form-control" id="cerca" placeholder="es. Harari, Tolkien..." />
      </div>
      <div class="spinner-container d-flex justify-content-start align-items-center gap-2 mt-3">
        <div id="spinner" class="spinner-border" hidden></div>
        <span id="spinner-text" class="fs-5" hidden>Caricamento in corso...</span>
      </div>
      <div id="errore" class="alert alert-danger text-danger mt-3 mb-0" hidden></div>
      <ul id="risultati" class="risultati list-unstyled d-flex flex-column gap-2 mb-3"></ul>
    </section>

    <section class="form-section card border-0 shadow-sm p-4 mb-4">
      <h2 class="fs-4 fw-bold mb-4 mt-2">Aggiungi un libro</h2>

      <form id="aggiungi-libro" class="form">

        <div class="campo mb-3">
          <label for="titolo" class="form-label fw-bold">Titolo</label>
          <input class="form-control" type="text" id="titolo" name="titolo" required>
        </div>

        <div class="campo mb-3">
          <label for="autore" class="form-label fw-bold">Autore</label>
          <input class="form-control" type="text" id="autore" name="autore" required>
        </div>

        <div class="campo mb-3">
          <label for="anno" class="form-label fw-bold">Anno</label>
          <input class="form-control" type="number" id="anno" name="anno">
        </div>

        <div class="campo mb-3">
          <label for="formato" class="form-label fw-bold">Formato</label>
          <select class="form-select" id="formato" name="formato">
            <option value="cartaceo">Cartaceo</option>
            <option value="digitale">Digitale</option>
            <option value="audio">Audio</option>
          </select>
        </div>

        <div class="campo campo-condizionale mb-3" id="campo-dimensione" hidden>
          <label for="dimensione-mb" class="form-label fw-bold">Dimensione MB</label>
          <input class="form-control" type="number" id="dimensione-mb" name="dimensione-mb" step="0.1">
        </div>

        <div class="campo campo-condizionale mb-3" id="campo-durata" hidden>
          <label for="durata-minuti" class="form-label fw-bold">Durata (minuti)</label>
          <input class="form-control" type="number" id="durata-minuti" name="durata-minuti">
        </div>

        <button type="submit" class="aggiungi mt-2 py-2 px-4 btn btn-primary">Aggiungi</button>

      </form>
    </section>

    <section class="lista-section pt-2">
      <div class="lista-header d-flex justify-content-between align-items-center pb-1">
        <h2 class="fs-3 fw-bold mb-0 me-2">I tuoi libri (<span id="contatore">0</span>)</h2>
        <div class="d-flex gap-2">
          <button id="esporta-tutto" class="btn-esporta btn btn-outline-dark">Esporta</button>
          <button id="svuota-tutto" class="btn-svuota btn btn-outline-danger">Svuota tutto</button>
        </div>
      </div>

      <p class="info-storage mt-2 mb-3 fst-italic text-muted">I libri sono salvati nel browser e sopravvivono al
        refresh.</p>

      <div class="d-flex flex-wrap flex-sm-nowrap gap-2 justify-content-start align-items-center align-content-center">
        <button type="button" class="filtri btn btn-dark">Tutti</button>
        <button type="button" class="filtri btn btn-outline-dark">Letti</button>
        <button type="button" class="filtri btn btn-outline-dark">Da leggere</button>
        <select class="ordina form-select" id="ordinamento" name="ordinamento">
          <option value=""></option>
          <option value="Titolo">Titolo</option>
          <option value="Anno">Anno</option>
        </select>
      </div>

      <ul id="lista-libri" class="list-unstyled d-flex flex-column gap-2 mt-3"></ul>
    </section>

  </main>

  <script type="module" src="assets/js/main.js"></script>
</body>

</html>
